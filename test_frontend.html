<script>
var STATE={};
function q(s){return document.querySelector(s)}
function qa(s){return Array.from(document.querySelectorAll(s))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stripReleaseMarkers(v){
 var text=String(v||'').toLowerCase().trim();if(!text)return '';
 text=text.replace(/^\s*[\[(（［【]\s*(?:(?:eng(?:lish)?\s+)?dub(?:bed)?)\s*[\])）］】]\s*[:|–—-]*\s*/i,'');
 text=text.replace(/\s*[:|–—-]*\s*[\[(（［【]\s*(?:(?:eng(?:lish)?\s+)?dub(?:bed)?)\s*[\])）］】]\s*$/i,'');
 text=text.replace(/^\s*(?:(?:eng(?:lish)?\s+)dub(?:bed)?\b\s*[:|–—-]+\s*|(?:eng(?:lish)?\s+)dub(?:bed)?\b\s+)/i,'');
 text=text.replace(/\s*[:|–—-]+\s*dub(?:bed)?\s*$/i,'');
 text=text.replace(/\s+(?:eng(?:lish)?\s+)dub(?:bed)?\s*$/i,'');
 return text.trim();
}
function norm(v){return stripReleaseMarkers(v).replace(/[^a-z0-9]+/g,'')}
function sourceType(run){var c=(run.result_json&&run.result_json.collector)||{};return String(c.sourceType||'SHORT_DRAMA_APP')}
function targetKey(run){var c=(run.result_json&&run.result_json.collector)||{};return String(c.targetKey||'daily_top_all')}
function rankingType(run){var c=(run.result_json&&run.result_json.collector)||{};return String(c.rankingType||'主榜')}
function topN(run){var c=(run.result_json&&run.result_json.collector)||{};var rows=(run.result_json&&run.result_json.rows)||[];return Number(c.topN||rows.length||10)}
function scopeInferred(run){return !(run.result_json&&run.result_json.collector&&run.result_json.collector.sourceType)}
function validBatch(run){
 var r=run.result_json||{},rows=Array.isArray(r.rows)?r.rows:[],n=topN(run);
 if(r.batchComplete!==true||rows.length!==n||n<1)return false;
 var ranks=new Set(),titles=new Set();
 for(var i=0;i<rows.length;i++){var rank=Number(rows[i].rank);var t=norm(rows[i].title);if(!Number.isInteger(rank)||rank<1||rank>n||ranks.has(rank)||!t||titles.has(t))return false;ranks.add(rank);titles.add(t)}
 return ranks.size===n;
}
function latestAuthoritative(runs){
 var m=new Map();
 runs.filter(function(r){return sourceType(r)==='SHORT_DRAMA_APP'&&validBatch(r)}).forEach(function(r){
  var k=[r.collection_date,r.platform,sourceType(r),targetKey(r)].join('::'),p=m.get(k);
  if(!p||String(r.updated_at||'')>String(p.updated_at||''))m.set(k,r);
 });
 return Array.from(m.values()).sort(function(a,b){return String(a.collection_date).localeCompare(String(b.collection_date))||String(a.platform).localeCompare(String(b.platform))});
}
function latestTaskMap(tasks,runs){
 var runMap=new Map(runs.map(function(r){return [String(r.id),r]})),m=new Map();
 tasks.forEach(function(t){
  var run=runMap.get(String(t.analysis_run_id)),src=run?sourceType(run):'UNKNOWN';
  if(src!=='SHORT_DRAMA_APP')return;
  var tk=run?targetKey(run):'';
  var k=String(t.platform||'')+'::'+tk+'::'+norm(t.normalized_title||t.title),p=m.get(k);
  if(!p||String(t.updated_at||'')>String(p.updated_at||''))m.set(k,t);
 });
 return m;
}
function applyResearch(rec,task){
 if(!task)return;
 rec.researchTask=task;
 var r=task.research_json&&typeof task.research_json==='object'?task.research_json:{};
 ['synopsis','genre','lane','audience','storyCore','storySkin','conflict','payoff','openingSummary','openingType','payEpisode','paywallSummary','paywallType','localizationLevel','localizationJudgment','mismatch','posterUrl'].forEach(function(k){if(!rec[k]&&r[k])rec[k]=r[k]});
}
function buildRecords(base,runs,tasks,overrides){
 var recMap=new Map(),overrideMap=new Map(overrides.map(function(o){return [String(o.drama_id),o.fields_json||{}]}));
 (base.records||[]).forEach(function(x){
  var r=Object.assign({},x,{targetKey:'daily_top_all',rankingType:'主榜',sourceType:'SHORT_DRAMA_APP',scopeInferred:true,dataQuality:'LEGACY_REVIEWED'});
  r.history=(r.history||[]).map(function(h){return Object.assign({},h,{targetKey:'daily_top_all',rankingType:'主榜',sourceType:'SHORT_DRAMA_APP',scopeInferred:true,analysisRunId:'legacy:data.json'})});
  Object.assign(r,overrideMap.get(String(r.id))||{});
  recMap.set(String(r.app)+'::daily_top_all::'+norm(r.title),r);
 });
 latestAuthoritative(runs).forEach(function(run){
  var rows=run.result_json.rows||[],tk=targetKey(run),rt=rankingType(run),inf=scopeInferred(run);
  rows.forEach(function(x){
   var key=String(run.platform)+'::'+tk+'::'+norm(x.title),r=recMap.get(key);
   if(!r){r={id:'scope-'+btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9]/g,'').slice(0,18),title:x.title,app:run.platform,targetKey:tk,rankingType:rt,sourceType:'SHORT_DRAMA_APP',history:[],scopeInferred:inf};recMap.set(key,r)}
   var ev={date:String(run.collection_date),app:run.platform,targetKey:tk,rankingType:rt,sourceType:'SHORT_DRAMA_APP',rank:Number(x.rank),heat:x.heat||'',tags:Array.isArray(x.tags)?x.tags.join(', '):(x.tags||''),metrics:x.metrics||{},scopeInferred:inf,analysisRunId:run.id,dataQuality:'VALID'};
   r.history=(r.history||[]).filter(function(h){return !(h.date===ev.date&&String(h.app||r.app)===ev.app&&String(h.targetKey||r.targetKey||'daily_top_all')===tk)});r.history.push(ev);r.history.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
   var last=r.history[r.history.length-1];r.date=last.date;r.rank=last.rank;r.heat=last.heat;r.tags=last.tags;r.platformMetrics=last.metrics;r.scopeInferred=inf;r.analysisRunId=run.id;r.dataQuality='VALID';
   r.recordedDates=Array.from(new Set(r.history.map(function(h){return h.date}))).sort();r.firstDate=r.recordedDates[0];r.lastDate=r.recordedDates[r.recordedDates.length-1];r.daysOnChart=r.recordedDates.length;
   var rr=r.history.map(function(h){return Number(h.rank)}).filter(function(v){return Number.isFinite(v)});r.highestRank=rr.length?Math.min.apply(null,rr):r.rank;
   if(x.posterUrl)r.posterUrl=x.posterUrl;
  });
 });
 var tm=latestTaskMap(tasks,runs);
 recMap.forEach(function(r){applyResearch(r,tm.get(String(r.app)+'::'+String(r.targetKey||'daily_top_all')+'::'+norm(r.title)));applyChinesePresentation(r);r.firstSeenAppRanking=r.firstDate||'';r.appRankingNewness='RECORDED_FIRST_SEEN'});
 return Array.from(recMap.values());
}
function taskSource(t,runMap){var r=runMap.get(String(t.analysis_run_id));return r?sourceType(r):'UNKNOWN'}
function buildWeb(runs,tasks){
 var taskBy=new Map();
 tasks.forEach(function(t){taskBy.set(String(t.analysis_run_id)+'::'+norm(t.title),t)});
 var rows=[];
 runs.filter(function(r){return sourceType(r)==='OFFICIAL_WEB'}).forEach(function(run){
  var rr=(run.result_json&&run.result_json.rows)||[],tk=targetKey(run),rt=rankingType(run),valid=validBatch(run);
  rr.forEach(function(x,i){var t=taskBy.get(String(run.id)+'::'+norm(x.title));rows.push({date:run.collection_date,platform:run.platform,targetKey:tk,rankingType:rt,rank:Number(x.rank||x.position||i+1),title:x.title,tags:Array.isArray(x.tags)?x.tags.join(', '):(x.tags||''),metrics:x.metrics||{},batchComplete:run.result_json.batchComplete===true,batchValid:valid,runStatus:run.status,task:t||null,analysisRunId:run.id})});
 });
 return rows;
}
function buildBackfillWeb(datasets){
 var rows=[];
 (datasets||[]).forEach(function(ds){
  (ds.acceptedBatches||[]).forEach(function(batch){
   (batch.rows||[]).forEach(function(x){
    rows.push({
     date:batch.collectionDate||ds.collectionDate,
     platform:batch.platform,
     targetKey:batch.targetKey,
     rankingType:batch.rankingType,
     rank:Number(x.rank),
     title:x.title,
     tags:'',
     metrics:{},
     batchComplete:true,
     batchValid:true,
     runStatus:'UI_STAGING_BACKFILL',
     task:null,
     analysisRunId:'',
     datasetOrigin:'WEB_BACKFILL',
     researchEligible:false,
     sourceUrl:x.sourceUrl||batch.sourceUrl||''
    });
   });
  });
 });
 return rows;
}
function summarizeBackfill(datasets){
 var ds=datasets||[],acceptedBatches=0,acceptedRows=0,rejected=[];
 ds.forEach(function(x){
  acceptedBatches+=Number(x.acceptedBatchCount||0);
  acceptedRows+=Number(x.acceptedRowCount||0);
  (x.rejectedBatches||[]).forEach(function(r){rejected.push(r)});
 });
 return {
  dates:ds.map(function(x){return x.collectionDate}).filter(Boolean).sort(),
  acceptedBatches:acceptedBatches,
  acceptedRows:acceptedRows,
  rejectedBatches:rejected
 };
}
function groupCount(arr,keyfn){var m=new Map();arr.forEach(function(x){var k=keyfn(x)||'未标注';m.set(k,(m.get(k)||0)+1)});return Array.from(m.entries()).map(function(x){return {name:x[0],value:x[1]}}).sort(function(a,b){return b.value-a.value||String(a.name).localeCompare(String(b.name))})}
function chipState(s){s=String(s||'UNKNOWN').toUpperCase();return s==='COMPLETE'?'blue':(s==='FAILED'||s==='REVIEW_REQUIRED')?'red':(s==='PENDING'||s==='UNKNOWN')?'gray':'amber'}
function researchStatusLabel(s){
 var m={PENDING:'待处理',RESEARCHING:'研究中',COMPLETE:'已完成',NEEDS_GPT:'待补充研究',REVIEW_REQUIRED:'需人工复核',FAILED:'研究失败',UNKNOWN:'暂无研究任务'};
 return m[String(s||'UNKNOWN').toUpperCase()]||String(s||'');
}
function confidenceLabel(s){var m={high:'高',medium:'中',low:'低'};return m[String(s||'').toLowerCase()]||'—'}
function localizationLabel(s){var m={A:'高',B:'中高',C:'中',D:'低',high:'高',medium:'中',low:'低'};return m[String(s||'')]||String(s||'—')}
function metricText(v){return String(v==null?'':v).replace(/Followers?/gi,'粉丝').replace(/Views?/gi,'播放').replace(/Plays?/gi,'播放').replace(/Likes?/gi,'点赞').replace(/Comments?/gi,'评论').replace(/Shares?/gi,'分享')}
