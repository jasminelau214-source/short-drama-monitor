<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>榜单采集中心｜短剧市场监测</title>
<style>
:root{--bg:#f6f7f4;--panel:#fff;--ink:#173c37;--muted:#6c7b74;--line:#dfe5dd;--accent:#0f7b68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:820px;margin:auto;padding:26px 18px 70px}.nav{display:flex;gap:14px;margin-bottom:24px}.nav a{color:var(--ink);text-decoration:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}h1{margin:0 0 6px}.sub,.note{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-weight:650}input,select,button{font:inherit}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px}button{border:0;border-radius:9px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:720;cursor:pointer}.files{margin-top:16px}.status{margin-top:16px;display:grid;gap:8px}.row{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfa}.ok{color:var(--accent)}.bad{color:#a84855}@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<nav class="nav"><a href="/">← 市场仪表盘</a><a href="/review">审核后台</a></nav>
<h1>📥 榜单采集中心</h1><div class="sub">V1.2 Beta｜上传四个平台榜单截图，原图进入待分析区。当前结构化识别、深度研究和审核仍由 ChatGPT 对话链路执行；后续再接独立 OCR / 模型 API。</div>
<section class="card">
<div class="grid"><label>采集日期<input id="date" type="date"></label><label>平台<select id="platform"><option>ReelShort</option><option>DramaWave</option><option>MoboReels</option><option>NetShort</option></select></label></div>
<label class="files">榜单截图<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
<p class="note">只上传榜单原始截图；不要先裁掉排名、热度或平台标签。系统事实层只认截图，分析字段与事实字段分开审核。</p>
<button id="upload" type="button">上传到待分析区</button><div id="status" class="status"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);const pad=n=>String(n).padStart(2,'0');const d=new Date();$('#date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function base64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
$('#upload').onclick=async()=>{const files=[...$('#files').files];const box=$('#status');box.innerHTML='';if(!files.length){box.innerHTML='<div class="row bad">请先选择截图。</div>';return}$('#upload').disabled=true;for(const file of files){const row=document.createElement('div');row.className='row';row.textContent=`${file.name}：上传中…`;box.appendChild(row);try{const res=await fetch('/api/admin/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('#date').value,platform:$('#platform').value,filename:file.name,mimeType:file.type,dataBase64:await base64(file)})});const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);row.classList.add('ok');row.textContent=`${file.name}：已进入待分析区（${data.status}）`;}catch(e){row.classList.add('bad');row.textContent=`${file.name}：${e.message}`}}$('#upload').disabled=false}
</script></body></html>
