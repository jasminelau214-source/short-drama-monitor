<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>榜单采集中心｜短剧市场监测</title>
<style>
:root{--bg:#f6f7f4;--panel:#fff;--ink:#173c37;--muted:#6c7b74;--line:#dfe5dd;--accent:#0f7b68;--danger:#a84855}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:920px;margin:auto;padding:26px 18px 70px}.nav{display:flex;gap:14px;margin-bottom:24px}.nav a{color:var(--ink);text-decoration:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}h1,h2{margin:0 0 6px}.sub,.note,.meta{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-weight:650}input,select,button{font:inherit}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px}button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:720;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#eef2ed;color:var(--ink);border:1px solid var(--line)}.files{margin-top:16px}.status{margin-top:16px;display:grid;gap:8px}.row{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfa}.ok{color:var(--accent)}.bad{color:var(--danger)}.queue{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.title{font-weight:720}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:3px 8px;border-radius:999px;background:#eef2ed;color:var(--muted);font-size:12px}.pill.bad{background:#faeded;color:var(--danger)}.empty{color:var(--muted);padding:12px 0}@media(max-width:640px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<nav class="nav"><a href="/">← 市场仪表盘</a><a href="/review">审核后台</a></nav>
<h1>📥 榜单采集中心</h1><div class="sub">V1.2.1 Beta｜上传四个平台榜单截图，原图进入待分析区。新增待分析队列与24小时安全分析链接；结构化识别、深度研究和审核仍由 ChatGPT 对话链路执行。</div>
<section class="card">
<div class="grid"><label>采集日期<input id="date" type="date"></label><label>平台<select id="platform"><option>ReelShort</option><option>DramaWave</option><option>MoboReels</option><option>NetShort</option></select></label></div>
<label class="files">榜单截图<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
<p class="note">只上传榜单原始截图；不要先裁掉排名、热度或平台标签。系统事实层只认截图，分析字段与事实字段分开审核。</p>
<button id="upload" type="button">上传到待分析区</button><div id="status" class="status"></div>
</section>
<section class="card"><h2>待分析队列</h2><div class="sub">分析链接为短期签名链接，不包含管理员密码。若 Render 重启/重新部署导致原图失效，会显示“原图已失效”，需要重新上传。</div><div id="queue" class="queue"><div class="empty">正在读取上传记录…</div></div></section>
</main>
<script>
const $=s=>document.querySelector(s);const pad=n=>String(n).padStart(2,'0');const d=new Date();$('#date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function base64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
function fullUrl(path){return new URL(path,location.origin).href}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function copyLink(path,button){try{await navigator.clipboard.writeText(fullUrl(path));const old=button.textContent;button.textContent='已复制';setTimeout(()=>button.textContent=old,1500)}catch(e){prompt('复制下面的分析链接：',fullUrl(path))}}
async function loadQueue(){const box=$('#queue');try{const res=await fetch('/api/admin/uploads',{headers:{Accept:'application/json'}});const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);if(!data.uploads.length){box.innerHTML='<div class="empty">暂时没有上传记录。</div>';return}box.innerHTML=data.uploads.map(x=>{const available=x.available&&x.analysisUrl;return `<div class="item"><div><div class="title">${esc(x.filename)}</div><div class="meta">${esc(x.collection_date)} · ${esc(x.platform)} · ${esc(x.status)} · ${new Date(x.created_at).toLocaleString('zh-CN')}</div><span class="pill ${available?'':'bad'}">${available?'原图可读取':'原图已失效'}</span></div><div class="actions">${available?`<a class="btn secondary" href="${esc(x.analysisUrl)}" target="_blank" rel="noopener">查看原图</a><button class="copy" data-link="${esc(x.analysisUrl)}">复制分析链接</button>`:'<span class="meta">请重新上传</span>'}</div></div>`}).join('');box.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copyLink(b.dataset.link,b))}catch(e){box.innerHTML=`<div class="row bad">${esc(e.message)}</div>`}}
$('#upload').onclick=async()=>{const files=[...$('#files').files],box=$('#status');box.innerHTML='';if(!files.length){box.innerHTML='<div class="row bad">请先选择截图。</div>';return}$('#upload').disabled=true;for(const file of files){const row=document.createElement('div');row.className='row';row.textContent=`${file.name}：上传中…`;box.appendChild(row);try{const res=await fetch('/api/admin/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('#date').value,platform:$('#platform').value,filename:file.name,mimeType:file.type,dataBase64:await base64(file)})});const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);row.classList.add('ok');row.textContent=`${file.name}：已进入待分析区（${data.status}）`}catch(e){row.classList.add('bad');row.textContent=`${file.name}：${e.message}`}}$('#upload').disabled=false;$('#files').value='';await loadQueue()};loadQueue();
</script></body></html>
