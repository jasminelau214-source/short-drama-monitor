name: Production Readiness A Audit Execution
run-name: "AUDIT_EXECUTION_ONLY | A Truth | run #${{ github.run_number }}"

on:
  push:
    branches:
      - audit/production-readiness-a-truth-7platform-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-execution:
    name: AUDIT_EXECUTION_ONLY (readiness in summary/artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated audit runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright pycryptodome
          python -m playwright install --with-deps chromium

      - name: Compile readiness audit
        run: python -m py_compile production_readiness.py readiness_truth_audit.py branch_version_matrix.py test_production_readiness.py

      - name: Build branch/version matrix
        run: python branch_version_matrix.py

      - name: Test readiness gate compatibility
        run: python -m unittest -v test_production_readiness.py

      - name: Collect current seven-platform official Web candidates
        run: |
          python pilot_web_top10_v3.py --date 2026-09-20
          echo "CANDIDATE_BATCH_COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run independent Truth Test
        run: python readiness_truth_audit.py --date 2026-09-20

      - name: Publish readiness result separately from CI execution
        if: always()
        run: |
          echo "## Readiness result (separate from CI execution)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A green job means only **AUDIT_EXECUTED_SUCCESSFULLY**." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not mean **PRODUCTION_READY**." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f readiness_audit/2026-09-20/TRUTH_AUDIT.md ]; then
            cat readiness_audit/2026-09-20/TRUTH_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f readiness_audit/BRANCH_VERSION_MATRIX.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat readiness_audit/BRANCH_VERSION_MATRIX.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload A-phase evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-a-truth-7platform-${{ github.run_id }}
          path: |
            readiness_audit/
            pilot_evidence/2026-09-20/
            pilot_data/2026-09-20/
          if-no-files-found: warn
          retention-days: 30
