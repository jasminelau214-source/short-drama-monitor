name: Production Readiness A Truth Audit

on:
  push:
    branches:
      - audit/production-readiness-a-truth-7platform-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated audit runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright pycryptodome
          python -m playwright install --with-deps chromium

      - name: Compile readiness audit
        run: python -m py_compile production_readiness.py readiness_truth_audit.py test_production_readiness.py

      - name: Test readiness gate compatibility
        run: python -m unittest -v test_production_readiness.py

      - name: Collect current seven-platform official Web candidates
        run: python pilot_web_top10_v3.py --date 2026-09-20

      - name: Run independent Truth Test
        run: python readiness_truth_audit.py --date 2026-09-20

      - name: Upload A-phase evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-a-truth-7platform-${{ github.run_id }}
          path: |
            readiness_audit/2026-09-20/
            pilot_evidence/2026-09-20/
            pilot_data/2026-09-20/
          if-no-files-found: warn
          retention-days: 30
