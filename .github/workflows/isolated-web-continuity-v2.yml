name: Isolated Web Continuity V2 Six Platforms
on:
  workflow_dispatch:
  push:
    branches:
      - test/web-continuity-v2-20261010
    paths:
      - 'continuity_triggers/**'
      - 'pilot_web_top10.py'
      - 'pilot_web_top10_v3.py'
      - 'pilot_exact_web_adapters.py'
      - 'pilot_scope.json'
      - 'continuity_gate_v2.py'
      - '.github/workflows/isolated-web-continuity-v2.yml'
permissions:
  contents: write
concurrency:
  group: isolated-web-continuity-v2
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/web-continuity-v2-20261010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated browser (no production secrets)
        run: |
          pip install playwright pycryptodome
          python -m playwright install --with-deps chromium
      - name: Collect six official Web targets as candidate observations only
        run: python pilot_web_top10_v3.py
      - name: Run fail-closed V2 scope and batch gate
        id: gate
        continue-on-error: true
        run: python continuity_gate_v2.py
      - name: Upload raw evidence even on partial platform failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-web-continuity-${{ github.run_id }}
          path: |
            pilot_evidence/
            pilot_data/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit isolated snapshots only (never production data)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pilot_data
          if git diff --cached --quiet; then echo 'No new snapshot'; exit 0; fi
          git commit -m "Isolated Web V2 snapshot $(date -u +%F)"
          git fetch origin test/web-continuity-v2-20261010
          git push origin HEAD:test/web-continuity-v2-20261010
      - name: Fail visible job when any platform missing (others retained)
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: test "$GATE_OUTCOME" = success
