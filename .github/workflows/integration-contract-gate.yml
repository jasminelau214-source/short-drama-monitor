name: JSM Integration Contract Gate

on:
  push:
    branches:
      - integration/core-contract-v1-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jsm_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jsm_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: jsm_integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile contract surface
        run: python -m py_compile drama_identity.py collector_import.py live_observations.py live_observations_v2.py app.py research_guard.py research_validation.py research_writeback.py research_pipeline.py research_worker.py source_evidence_guard.py test_drama_identity_contract.py test_research_contracts.py test_fault_gate_incidents.py

      - name: Run Python Contract v1 tests
        run: python -m unittest -v test_drama_identity_contract.py test_research_contracts.py test_fault_gate_incidents.py

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Prepare ephemeral Integration database
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/identity_contract_fixture.sql

      - name: Apply Integration-only DB Identity migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260920_01_drama_identity_contract_v1.sql

      - name: Run DB-side Drama Identity Contract v1 tests
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/test_drama_identity_contract.sql
