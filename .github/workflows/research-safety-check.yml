name: Research safety check

on:
  push:
    branches:
      - dev/research-safety-hardening
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile research_safety.py research_pipeline.py research_worker.py app.py
      - name: Unit tests
        run: python -m unittest -v test_research_safety.py
