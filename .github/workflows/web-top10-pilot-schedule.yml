name: Scheduled Web Top10 pilot

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-web-top10-pilot
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/web-top10-8platform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser runtime and pilot crypto dependency
        run: |
          python -m pip install --upgrade pip
          pip install playwright pycryptodome
          python -m playwright install --with-deps chromium

      - name: Run isolated eight-platform Web Top10 pilot
        run: python pilot_web_top10_v3.py

      - name: Discover official JSON/API candidates for incomplete paths
        run: python pilot_api_discovery.py

      - name: Collect alternate official API candidates
        run: python pilot_alt_sources.py

      - name: Classify Web path blockers and fallback needs
        run: python pilot_path_decision.py

      - name: Build acceptance and scope-decision report
        run: python pilot_acceptance_report.py

      - name: Upload raw evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-web-top10-pilot-evidence-${{ github.run_id }}
          path: pilot_evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit parsed pilot results to pilot branch only
        shell: bash
        run: |
          set -euo pipefail

          TARGET_BRANCH="pilot/web-top10-8platform"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pilot_data
          if git diff --cached --quiet; then
            echo "No pilot data changes"
            exit 0
          fi

          START_HEAD="$(git rev-parse HEAD)"
          git commit -m "Scheduled Pilot Web Top10 results $(date -u +%F)"

          # Branch-drift protection:
          # never force-push. If the pilot branch advanced while this run was collecting,
          # rebase this run's isolated pilot-data commit onto the new remote head.
          # If generated files conflict, stop safely and keep the evidence artifact.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            REMOTE_HEAD="$(git rev-parse "origin/$TARGET_BRANCH")"

            if ! git merge-base --is-ancestor "$REMOTE_HEAD" HEAD; then
              echo "Pilot branch drift detected: start=$START_HEAD remote=$REMOTE_HEAD attempt=$attempt"
              if ! git rebase "origin/$TARGET_BRANCH"; then
                git rebase --abort || true
                echo "::error::Pilot branch changed with conflicting pilot_data. Refusing to overwrite remote data."
                exit 1
              fi
            fi

            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi

            echo "Push raced with another update; retrying safely ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "::error::Pilot branch kept advancing; refusing force-push after 3 safe retries."
          exit 1
