name: JSM Frontend All-Data Snapshot Check

on:
  push:
    branches:
      - test/frontend-all-data-v2-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python snapshot contract
        run: python -m unittest -v test_frontend_snapshot_contract.py
      - name: Compile Integration surface used by the test frontend
        run: python -m py_compile app.py live_observations.py drama_identity.py test_frontend_snapshot_contract.py
      - name: Verify static frontend structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('test_frontend.html').read_text(encoding='utf-8')
          assert '<script>' in html and '</script>' in html
          assert html.count('data-view=') >= 8
          assert 'READ ONLY' in html
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/test_frontend.js').write_text(script,encoding='utf-8')
          print('FRONTEND_STATIC_STRUCTURE_PASS')
          PY
          node --check /tmp/test_frontend.js
