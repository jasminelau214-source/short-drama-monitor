name: Collector direct import check
on:
  push:
    branches:
      - main
      - work/collector-direct-import-v1
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile app.py collector_import.py live_observations.py live_observations_v2.py official_web_collectors.py
      - run: python -m unittest -v test_collector_import.py test_live_observations_v2.py test_official_web_collectors.py
