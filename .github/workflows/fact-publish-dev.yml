name: Fact publish dev check
on:
  push:
    branches:
      - dev/fact-publish-research-queue
permissions:
  contents: write
jobs:
  test-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fact-publish-research-queue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch app integration
        run: python scripts/patch_live_data.py
      - name: Compile
        run: python -m py_compile app.py analysis_pipeline.py live_observations.py
      - name: Smoke test
        run: python scripts/smoke_live_observations.py
      - name: Commit generated app patch if needed
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "Publish complete screenshot facts to live frontend"
            git push origin HEAD:dev/fact-publish-research-queue
          fi
