name: Dev compile check
on:
  push:
    branches:
      - dev/auto-analysis-pipeline
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile app.py analysis_pipeline.py
