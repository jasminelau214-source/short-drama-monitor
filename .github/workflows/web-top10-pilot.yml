name: Web Top10 pilot branch check

on:
  workflow_dispatch:
  push:
    branches:
      - pilot/web-top10-8platform
    paths:
      - pilot_web_top10.py
      - pilot_web_top10_v2.py
      - pilot_web_top10_v3.py
      - pilot_exact_web_adapters.py
      - pilot_scope.json
      - official_web_collectors.py
      - goodshort_collector.py
      - .github/workflows/web-top10-pilot.yml

permissions:
  contents: write

concurrency:
  group: web-top10-pilot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/web-top10-8platform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run isolated eight-platform Web Top10 pilot
        run: python pilot_web_top10_v3.py

      - name: Upload raw evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-top10-pilot-evidence-${{ github.run_id }}
          path: pilot_evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit parsed pilot results only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot_data
          if git diff --cached --quiet; then
            echo "No pilot data changes"
          else
            git commit -m "Pilot Web Top10 results $(date -u +%F)"
            git push origin HEAD:pilot/web-top10-8platform
          fi
