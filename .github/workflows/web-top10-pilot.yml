name: Web Top10 pilot branch check

on:
  workflow_dispatch:
  push:
    branches:
      - pilot/web-top10-8platform
    paths:
      - pilot_web_top10.py
      - pilot_web_top10_v2.py
      - pilot_web_top10_v3.py
      - pilot_api_discovery.py
      - pilot_path_decision.py
      - pilot_acceptance_report.py
      - pilot_alt_sources.py
      - pilot_dramawave_api.py
      - pilot_shortmax_api.py
      - pilot_render_probe.py
      - pilot_exact_web_adapters.py
      - pilot_scope.json
      - official_web_collectors.py
      - goodshort_collector.py
      - .github/workflows/web-top10-pilot.yml

permissions:
  contents: write

concurrency:
  group: web-top10-pilot
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/web-top10-8platform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser runtime and pilot crypto dependency
        run: |
          python -m pip install --upgrade pip
          pip install playwright pycryptodome
          python -m playwright install --with-deps chromium

      - name: Run isolated eight-platform Web Top10 pilot
        run: python pilot_web_top10_v3.py

      - name: Discover official JSON/API candidates for incomplete paths
        run: python pilot_api_discovery.py

      - name: Collect alternate official API candidates
        run: python pilot_alt_sources.py

      - name: Classify Web path blockers and fallback needs
        run: python pilot_path_decision.py

      - name: Build acceptance and scope-decision report
        run: python pilot_acceptance_report.py

      - name: Upload raw evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-top10-pilot-evidence-${{ github.run_id }}
          path: pilot_evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit parsed pilot results only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          START_SHA="${GITHUB_SHA}"
          git fetch origin pilot/web-top10-8platform
          REMOTE_SHA="$(git rev-parse origin/pilot/web-top10-8platform)"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "Pilot branch advanced during this run; skip stale result commit."
            exit 0
          fi

          git add pilot_data
          if git diff --cached --quiet; then
            echo "No pilot data changes"
          else
            git commit -m "Pilot Web Top10 results $(date -u +%F)"
            git push origin HEAD:pilot/web-top10-8platform
          fi
