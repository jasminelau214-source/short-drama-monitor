name: JSM Integration GoodShort Fault Audit

on:
  push:
    branches:
      - integration/core-contract-v1-2026-09-20
    paths:
      - 'integration_goodshort_fault_audit.py'
      - 'test_goodshort_fault_integration.py'
      - 'goodshort_collector.py'
      - 'official_web_collectors.py'
      - 'collector_import.py'
      - 'source_evidence_guard.py'
      - 'web_promotion_gate.py'
      - '.github/workflows/integration-goodshort-fault.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile GoodShort fault surface
        run: python -m py_compile integration_goodshort_fault_audit.py test_goodshort_fault_integration.py

      - name: Run deterministic GoodShort platform fault tests
        run: python -m unittest -v test_goodshort_fault_integration.py

      - name: Run live read-only GoodShort fault audit
        run: |
          mkdir -p readiness_audit/integration_goodshort
          python integration_goodshort_fault_audit.py \
            --date "$(date -u +%F)" \
            --output readiness_audit/integration_goodshort/fault_audit.json

      - name: Publish audit result separately from execution
        if: always()
        run: |
          echo "## GoodShort Integration Fault Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A green job means the audit code executed; use the audit status below for the platform gate." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f readiness_audit/integration_goodshort/fault_audit.md ]; then
            cat readiness_audit/integration_goodshort/fault_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GoodShort fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-goodshort-fault-${{ github.run_id }}
          path: readiness_audit/integration_goodshort/
          if-no-files-found: warn
          retention-days: 30
