name: DramaBox cloud egress diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - pilot/web-top10-8platform
    paths:
      - .github/workflows/pilot-dramabox-egress.yml

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Probe DramaBox public page
        shell: bash
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          urls = [
              "https://www.dramaboxdb.com/channel/trending",
              "https://www.dramaboxdb.com/ja/channel/trending",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }
          for url in urls:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(2048)
                      print(url, "status=", r.status, "sample_bytes=", len(body), "title_hint=", b"Trending" in body)
              except urllib.error.HTTPError as exc:
                  print(url, "HTTPError", exc.code)
              except Exception as exc:
                  print(url, type(exc).__name__, str(exc)[:200])
          PY
