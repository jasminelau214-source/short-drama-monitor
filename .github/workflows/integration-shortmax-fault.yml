name: JSM Integration ShortMax Current Fault Audit

on:
  push:
    branches:
      - integration/core-contract-v1-2026-09-20
    paths:
      - 'integration_shortmax_fault_audit.py'
      - 'test_shortmax_fault_integration.py'
      - 'official_web_collectors.py'
      - 'run_official_web_collect.py'
      - 'collector_import.py'
      - 'source_evidence_guard.py'
      - 'web_promotion_gate.py'
      - '.github/workflows/integration-shortmax-fault.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'integration_shortmax_fault_audit.py'
      - 'test_shortmax_fault_integration.py'
      - 'official_web_collectors.py'
      - 'run_official_web_collect.py'
      - 'collector_import.py'
      - 'source_evidence_guard.py'
      - 'web_promotion_gate.py'
      - '.github/workflows/integration-shortmax-fault.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile ShortMax current-target fault surface
        run: python -m py_compile integration_shortmax_fault_audit.py test_shortmax_fault_integration.py

      - name: Run deterministic ShortMax current-target fault tests
        run: python -m unittest -v test_shortmax_fault_integration.py

      - name: Run live read-only ShortMax current-target fault audit
        run: |
          mkdir -p readiness_audit/integration_shortmax
          python integration_shortmax_fault_audit.py \
            --date "$(date -u +%F)" \
            --output readiness_audit/integration_shortmax/fault_audit.json

      - name: Publish audit result separately from execution
        if: always()
        run: |
          echo "## ShortMax Integration Current-Target Fault Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Current target follows the live official Most Popular shelf capacity. Historical Top10 is reported separately." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f readiness_audit/integration_shortmax/fault_audit.md ]; then
            cat readiness_audit/integration_shortmax/fault_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ShortMax fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-shortmax-fault-${{ github.run_id }}
          path: readiness_audit/integration_shortmax/
          if-no-files-found: warn
          retention-days: 30
