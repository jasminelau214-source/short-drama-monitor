name: P0-1 ranking scope check
on:
  push:
    branches:
      - feature/ui-redesign-v1
  workflow_dispatch:

jobs:
  ranking-scope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax check
        run: python -m py_compile app.py
      - name: Contract fixtures and forbidden-pattern scan
        run: python scripts/check_p0_1_frontend_contract.py
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("no inline script found")
          Path("/tmp/jsm-inline.js").write_text("\n\n".join(scripts), encoding="utf-8")
          print(f"extracted {len(scripts)} inline script block(s)")
          PY
      - name: JavaScript syntax check
        run: node --check /tmp/jsm-inline.js
