services:
  - type: web
    name: short-drama-monitor
    runtime: python
    plan: free
    buildCommand: python -m compileall app.py runtime_ui_patch.py
    startCommand: python runtime_ui_patch.py && python app.py --host 0.0.0.0 --no-open
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
