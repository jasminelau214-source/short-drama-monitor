<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>资料补全｜短剧热播榜研究工具</title>
  <style>
    :root{--bg:#f5f6f2;--panel:#fff;--soft:#f0f2ea;--ink:#222521;--muted:#667068;--line:#dce2da;--strong:#163d35;--accent:#0f7b68;--accent-soft:#dff2ed;--amber:#9c5e17;--danger:#984552;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);letter-spacing:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:rgba(245,246,242,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.brand{display:flex;align-items:center;gap:10px;color:var(--strong);font-weight:760}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--strong);color:#fff}.account{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.account a{color:var(--strong)}main{width:min(1440px,100%);margin:0 auto;padding:20px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}.chooser{position:sticky;top:83px;align-self:start;padding:14px;display:grid;gap:12px}.chooser h1{font-size:20px;margin:0;color:var(--strong)}.subtle{color:var(--muted);font-size:13px;line-height:1.55}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:9px 10px;outline:none}input,select{min-height:40px}textarea{min-height:112px;resize:vertical;line-height:1.55}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,123,104,.12)}.summary{padding:12px;background:var(--soft);border-radius:8px;display:grid;gap:5px}.summary strong{color:var(--strong)}.editor{padding:18px;display:grid;gap:18px}.editor-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.editor-head h2{margin:0 0 5px;color:var(--strong);font-size:24px}.badge{display:inline-flex;align-items:center;min-height:28px;padding:5px 9px;border-radius:8px;background:var(--accent-soft);color:var(--strong);font-size:13px}.group{display:grid;gap:12px}.group h3{margin:0;color:var(--strong);font-size:16px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.actions{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 2px;background:linear-gradient(180deg,rgba(245,246,242,0),var(--bg) 26%)}.save{min-width:132px;min-height:42px;border:0;border-radius:8px;background:var(--strong);color:#fff;font-weight:720;padding:9px 14px}.save:disabled{opacity:.55;cursor:wait}.status{font-size:13px;color:var(--muted)}.status.ok{color:var(--accent)}.status.error{color:var(--danger)}.empty{padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:860px){main{grid-template-columns:1fr;padding:12px}.chooser{position:static}.grid-2,.grid-3{grid-template-columns:1fr}.topbar{align-items:flex-start}.account{display:grid;justify-items:end}.editor-head{display:grid}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">填</span><span>短剧资料补全</span><a href="/" style="color:var(--strong);font-size:13px;font-weight:600">返回公开前台</a></div>
      <div class="account"><span id="accountEmail"></span><span>本地编辑模式</span></div>
    </header>
    <main>
      <aside class="panel chooser">
        <div><h1>选择剧目</h1><div class="subtle">填写后保存，公开详情页会读取最新结果。</div></div>
        <div class="field"><label for="search">搜索剧名</label><input id="search" type="search" placeholder="输入英文剧名"></div>
        <div class="field"><label for="dramaSelect">剧目</label><select id="dramaSelect"></select></div>
        <div id="recordSummary" class="summary"></div>
      </aside>
      <section id="editor" class="panel editor"><div class="empty">正在读取剧目数据…</div></section>
    </main>
  </div>
  <script>
    const editableFields=['genre','lane','audience','storyCore','storySkin','conflict','payoff','openingSummary','openingType','payEpisode','paywallSummary','paywallType','localizationLevel','localizationJudgment','mismatch'];
    let records=[];let currentId='';let accountEmail='';
    const $=(s,r=document)=>r.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const attr=v=>esc(v).replace(/`/g,'&#96;');
    const blank=v=>!v||v==='未采集';
    function missingCount(r){return editableFields.filter(k=>blank(r[k])).length}
    function refreshSelect(){const q=$('#search').value.trim().toLowerCase();const visible=records.filter(r=>!q||r.title.toLowerCase().includes(q));$('#dramaSelect').innerHTML=visible.map(r=>`<option value="${attr(r.id)}">${esc(r.app)} · #${r.rank} · ${esc(r.title)}</option>`).join('');if(!visible.length){currentId='';$('#editor').innerHTML='<div class="empty">没有匹配的剧目。</div>';$('#recordSummary').innerHTML='';return}if(!visible.some(r=>r.id===currentId))currentId=visible[0].id;$('#dramaSelect').value=currentId;renderEditor()}
    function input(label,key,value,kind='textarea'){const control=kind==='textarea'?`<textarea id="${key}" data-field="${key}">${esc(value)}</textarea>`:`<input id="${key}" data-field="${key}" value="${attr(value)}">`;return `<div class="field"><label for="${key}">${label}</label>${control}</div>`}
    function audience(value){return `<div class="field"><label for="audience">受众</label><select id="audience" data-field="audience">${['','女频','男频','泛受众'].map(v=>`<option value="${attr(v)}"${v===value?' selected':''}>${v||'请选择'}</option>`).join('')}</select></div>`}
    function renderEditor(){const r=records.find(x=>x.id===currentId);if(!r)return;const missing=missingCount(r);$('#recordSummary').innerHTML=`<strong>${esc(r.title)}</strong><span class="subtle">${esc(r.app)} · 第${r.rank}名</span><span class="subtle">待补字段 ${missing} 项</span>`;$('#editor').innerHTML=`
      <div class="editor-head"><div><h2>${esc(r.title)}</h2><div class="subtle">${esc(r.app)} · ${esc(r.date)} · 第${r.rank}名</div></div><span class="badge">${missing?'待补全 '+missing+' 项':'字段已完整'}</span></div>
      <section class="group"><h3>内容定位</h3><div class="grid-3">${input('题材','genre',r.genre,'input')}${input('细分赛道','lane',r.lane,'input')}${audience(r.audience)}</div></section>
      <section class="group"><h3>故事拆解</h3>${input('故事核','storyCore',r.storyCore)}${input('故事皮','storySkin',r.storySkin)}<div class="grid-2">${input('核心冲突','conflict',r.conflict)}${input('核心爽点','payoff',r.payoff)}</div></section>
      <section class="group"><h3>商业拆解</h3>${input('第一集开场总结','openingSummary',r.openingSummary)}<div class="grid-3">${input('开场方式','openingType',r.openingType,'input')}${input('首次付费集数','payEpisode',r.payEpisode,'input')}${input('付费卡点类型','paywallType',r.paywallType,'input')}</div>${input('首次付费卡点总结','paywallSummary',r.paywallSummary)}</section>
      <section class="group"><h3>欧美适配</h3><div class="grid-2">${input('本土化完成度','localizationLevel',r.localizationLevel,'input')}${input('本土化判断','localizationJudgment',r.localizationJudgment)}</div>${input('明显不适配点','mismatch',r.mismatch)}</section>
      <div class="actions"><span id="saveStatus" class="status">尚未保存本次修改</span><button id="saveButton" class="save">保存资料</button></div>`;$('#saveButton').addEventListener('click',()=>saveCurrent())}
    function collectFields(){return Object.fromEntries(editableFields.map(k=>[k,($(`[data-field="${k}"]`)?.value??'').trim()]))}
    async function saveCurrent(toolFields){const fields=toolFields||collectFields();const button=$('#saveButton');const status=$('#saveStatus');if(button)button.disabled=true;if(status){status.className='status';status.textContent='正在保存…'}try{const response=await fetch('/api/reviews/'+encodeURIComponent(currentId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});const result=await response.json();if(!response.ok)throw new Error(result.error||'保存失败');const index=records.findIndex(r=>r.id===currentId);records[index]={...records[index],...result.fields};renderEditor();$('#saveStatus').className='status ok';$('#saveStatus').textContent='已保存 · '+new Date(result.updatedAt).toLocaleString('zh-CN');return {dramaId:currentId,saved:true,updatedAt:result.updatedAt}}catch(error){if(status){status.className='status error';status.textContent=error.message}throw error}finally{if(button)button.disabled=false}}
    async function load(){const response=await fetch('/api/review-data',{headers:{Accept:'application/json'}});if(response.status===401){location.href='/signin-with-chatgpt?return_to='+encodeURIComponent(location.pathname+location.search);return}const result=await response.json();if(!response.ok){$('#editor').innerHTML=`<div class="empty">${esc(result.error||'无法读取资料')}</div>`;return}records=result.records;accountEmail=result.accountEmail||'';$('#accountEmail').textContent=accountEmail;const requestedId=new URLSearchParams(location.search).get('id');currentId=records.some(r=>r.id===requestedId)?requestedId:(records[0]?.id||'');$('#search').addEventListener('input',refreshSelect);$('#dramaSelect').addEventListener('change',e=>{currentId=e.target.value;history.replaceState(null,'','/review?id='+encodeURIComponent(currentId));renderEditor()});refreshSelect();registerWebMcp()}
    function registerWebMcp(){const context=document.modelContext;if(!context?.registerTool)return;const properties=Object.fromEntries(editableFields.map(k=>[k,{type:'string',maxLength:6000}]));Promise.resolve(context.registerTool({name:'save_drama_review',title:'保存剧目资料',description:'保存指定剧目的人工补全字段，并更新公开详情。',inputSchema:{type:'object',properties:{dramaId:{type:'string'},fields:{type:'object',properties,additionalProperties:false}},required:['dramaId','fields'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},async execute(input){if(!input||typeof input.dramaId!=='string'||!records.some(r=>r.id===input.dramaId))throw new Error('未知剧目');currentId=input.dramaId;$('#dramaSelect').value=currentId;renderEditor();return saveCurrent(input.fields)}})).catch(()=>{})}
    load();
  </script>
</body>
</html>
